           CSS VARIABLES: DARK & PURE WHITE LIGHT THEMES

        :root[data-theme="dark"] {

            --bg-secondary: #121418;
            --bg-header: #16181d;
            --bg-card: #181a20;
            --bg-card-hover: #1f222a;
            --bg-elevated: #22252e;

            --bg-hero-grad-end: #16181d;
            --bg-input: #121418;
            --border-color: #262932;
            --border-subtle: #1f2229;
            --text-primary: #f0f3f8;
            --text-secondary: #949ba6;

            --hero-art-opacity: 0.22;
            --dock-bg: #1e2128;
        }

        /* Чистый нормальный белый (Pure Clean White) */
        :root[data-theme="light"] {
            --bg-primary: #f8fafc;
            --bg-secondary: #f1f5f9;
            --bg-header: #ffffff;
            --bg-card: #ffffff;
            --bg-card-hover: #f8fafc;
            --bg-elevated: #f1f5f9;
            --bg-hero-grad-start: #f1f5f9;
            --bg-hero-grad-end: #ffffff;
            --bg-input: #ffffff;
            --border-color: #e2e8f0;
            --border-subtle: #f1f5f9;
            --text-primary: #0f172a;
            --text-secondary: #475569;

            --accent-primary: #2563eb;
            --accent-hover: #1d4ed8;
            --badge-bg: #f8fafc;
            --badge-border: #cbd5e1;
            --skeleton-1: #e2e8f0;
            --skeleton-2: #f1f5f9;
            --shadow-card: 0 4px 20px -2px rgba(15, 23, 42, 0.06);
            --hero-art-opacity: 0.12;
            --dock-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            transition: background-color 0.28s cubic-bezier(0.4, 0, 0.2, 1),
                        border-color 0.28s cubic-bezier(0.4, 0, 0.2, 1),
                        color 0.2s cubic-bezier(0.4, 0, 0.2, 1),
                        box-shadow 0.28s ease;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .font-mono-code {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        .portal-header {
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border-color);
        }

        .portal-subbar {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-subtle);
        }
