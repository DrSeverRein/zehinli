<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=0">
    <title>Zehinli — Наука и образование</title>
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- ПЕРЕМЕННЫЕ --- */
        :root { --bg-ground: #0f0f0f; --bg-layer-1: #1e1e1e; --bg-layer-2: #2a2a2a; --accent: #C8395F; --accent-hover: #e0436d; --text-main: #f2f2f2; --text-dim: #b3b3b3; --border-color: #333; --transition: all 0.3s ease; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-ground); color: var(--text-main); font-family: 'Red Hat Display', sans-serif; line-height: 1.6; overflow-x: hidden; }
        a { color: inherit; text-decoration: none; transition: var(--transition); }
        
        header { background: var(--bg-layer-1); border-bottom: 1px solid var(--border-color); padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 26px; font-weight: 900; color: var(--accent); text-transform: uppercase; }
        
        .mars-page { display: flex; gap: 24px; padding: 24px; max-width: 1400px; margin: 0 auto; align-items: flex-start; }
        .side-menu { width: 260px; flex-shrink: 0; position: sticky; top: 90px; }
        .nav-list { list-style: none; }
        .nav-list a { display: flex; align-items: center; gap: 15px; padding: 12px 15px; border-radius: 8px; color: var(--text-main); font-weight: 600; margin-bottom: 5px; }
        .nav-list a:hover, .nav-list a.active { background-color: var(--bg-layer-2); color: var(--accent); }
        
        .feed-container { flex-grow: 1; min-width: 0; }
        .card { background: var(--bg-layer-1); border-radius: 16px; padding: 24px; margin-bottom: 24px; border: 1px solid var(--border-color); transition: var(--transition); }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.2); border-color: #444; }
        .article-image { width: 100%; height: 300px; border-radius: 10px; object-fit: cover; margin-bottom: 20px; }
        
        .main-btn { display: inline-block; background-color: var(--accent); color: white; border: none; padding: 12px 28px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: var(--transition); }
        .main-btn:hover { background-color: var(--accent-hover); transform: scale(1.02); }

        /* --- СТИЛИ ДЛЯ ВСПЛЫВАЮЩЕГО ОКНА (МОДАЛКИ) --- */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px);
            z-index: 2000; justify-content: center; align-items: center;
            opacity: 0; transition: opacity 0.3s ease;
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        
        .modal-box {
            background: var(--bg-layer-1); border: 1px solid var(--border-color);
            padding: 40px; border-radius: 16px; width: 90%; max-width: 400px;
            position: relative; transform: translateY(-50px); transition: transform 0.3s ease;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5); text-align: center;
        }
        .modal-overlay.active .modal-box { transform: translateY(0); }
        
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 24px; color: var(--text-dim); cursor: pointer; }
        .close-btn:hover { color: white; }
        
        .modal-input {
            width: 100%; padding: 12px; margin-bottom: 15px; background: var(--bg-ground);
            border: 1px solid var(--border-color); color: white; border-radius: 8px; outline: none;
        }
        .modal-input:focus { border-color: var(--accent); }

        @media screen and (max-width: 768px) { .side-menu { display: none; } }
    </style>
</head>
<body>

    <header>
        <div class="logo">ZEHINLI</div>
        <nav style="display: flex; gap: 20px; align-items: center;">
            <a href="search.html" style="color: var(--text-dim); font-weight: 600;"><i class="fa-solid fa-magnifying-glass"></i> Поиск</a>
            <a href="#" id="openModalBtn" style="color: var(--text-dim); font-weight: 600;"><i class="fa-solid fa-user"></i> Войти</a>
        </nav>
