
<!DOCTYPE html>
<html lang="tk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSK 1: Türkmen - Hytaý</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        
        .perspective-1000 {
            perspective: 1000px;
        }
        
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        
        .rotate-y-180 {
            transform: rotateY(180deg);
        }

        .card-transition {
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col text-gray-800">

    <header class="bg-blue-600 text-white p-4 shadow-md">
        <div class="container mx-auto max-w-3xl flex justify-between items-center">
            <h1 class="text-2xl font-bold">HSK 1: Türkmen-Hytaý</h1>
            <div class="flex space-x-2">
                <button id="btnStudyMode" class="bg-blue-800 hover:bg-blue-700 px-4 py-2 rounded-lg text-sm font-semibold transition-colors" onclick="setMode('study')">Okan (Study)</button>
                <button id="btnQuizMode" class="bg-blue-500 hover:bg-blue-400 px-4 py-2 rounded-lg text-sm font-semibold transition-colors" onclick="setMode('quiz')">Synag (Quiz)</button>
            </div>
        </div>
    </header>

    <main class="flex-grow container mx-auto max-w-3xl p-4 flex flex-col items-center justify-center">
        
        <!-- Progress Info -->
        <div class="w-full flex justify-between mb-4 text-sm font-semibold text-gray-500">
            <span id="cardCounter">Kart: 1 / 150</span>
            <span id="scoreDisplay" class="hidden text-green-600">Dogry: 0</span>
        </div>

        <!-- Card Container -->
        <div class="relative w-full h-80 perspective-1000 cursor-pointer group" id="cardContainer" onclick="handleCardClick()">
            <div id="cardInner" class="w-full h-full relative transform-style-3d card-transition shadow-xl rounded-2xl">
                
                <!-- Front of Card (Turkmen) -->
                <div class="absolute w-full h-full bg-white rounded-2xl backface-hidden flex flex-col items-center justify-center p-6 border-2 border-gray-100">
                    <p class="text-gray-400 text-sm uppercase tracking-wider mb-4">Türkmen</p>
                    <h2 id="cardFrontText" class="text-3xl md:text-5xl font-bold text-center text-blue-900 break-words w-full">söýmek</h2>
                    <p id="clickHint" class="text-gray-400 text-sm mt-8 animate-pulse">Öwürmek üçin basyň</p>
                </div>

                <!-- Back of Card (Chinese) -->
                <div class="absolute w-full h-full bg-blue-50 rounded-2xl backface-hidden rotate-y-180 flex flex-col items-center justify-center p-6 border-2 border-blue-200">
                    <p class="text-blue-400 text-sm uppercase tracking-wider mb-2">Hytaý</p>
                    <h2 id="cardBackHanzi" class="text-7xl md:text-8xl font-bold text-gray-800 mb-4">爱</h2>
                    <h3 id="cardBackPinyin" class="text-2xl md:text-3xl font-semibold text-blue-600">ài</h3>
                </div>

            </div>
        </div>

        <!-- Quiz Input Area (Hidden by default) -->
        <div id="quizArea" class="w-full mt-8 hidden flex-col items-center">
            <div class="w-full flex">
                <input type="text" id="quizInput" class="flex-grow text-xl p-4 border-2 border-gray-300 rounded-l-xl focus:outline-none focus:border-blue-500 transition-colors" placeholder="Iýeroglifi ýazyň (Напишите иероглиф)..." onkeypress="handleKeyPress(event)">
                <button onclick="checkAnswer()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 rounded-r-xl font-bold text-lg transition-colors">Barlamak</button>
            </div>
            
            <!-- Feedback Message -->
            <div id="feedbackMessage" class="mt-4 text-xl font-bold hidden w-full text-center p-3 rounded-xl shadow-sm">
                <!-- Message injected via JS -->
            </div>
        </div>

        <!-- Navigation Controls -->
        <div class="flex space-x-4 mt-8 w-full justify-center">
            <button onclick="prevCard()" class="bg-white hover:bg-gray-50 text-gray-700 font-semibold py-3 px-6 border border-gray-300 rounded-xl shadow-sm transition-colors flex items-center">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                Öňki
            </button>
            <button onclick="shuffleCards()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-3 px-4 border border-gray-300 rounded-xl shadow-sm transition-colors" title="Gatmak (Shuffle)">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 8L12 12m0 0l4 4m-4-4l-4 4m4-4L8 8"></path></svg>
            </button>
            <button onclick="nextCard()" id="btnNext" class="bg-white hover:bg-gray-50 text-gray-700 font-semibold py-3 px-6 border border-gray-300 rounded-xl shadow-sm transition-colors flex items-center">
                Indiki
                <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </button>
        </div>
    </main>

            { tk: "nähili ýagdaý", hz: "怎么样", py: "zěn me yàng" },

            { tk: "Hytaý", hz: "中国", py: "zhōng guó" },
            { tk: "günortan", hz: "中午", py: "zhōng wǔ" },

            { tk: "düýn", hz: "昨天", py: "zuó tiān" },
            { tk: "etmek", hz: "做", py: "zuò" },
            { tk: "oturmak", hz: "坐", py: "zuò" }
        ];

        let vocab = [...originalVocab];
        let currentIndex = 0;
        let isFlipped = false;
        let currentMode = 'study'; // 'study' or 'quiz'
        let quizScore = 0;
        let quizAttempted = false;

        // DOM Elements
        const cardInner = document.getElementById('cardInner');
        const cardFrontText = document.getElementById('cardFrontText');
        const cardBackHanzi = document.getElementById('cardBackHanzi');
        const cardBackPinyin = document.getElementById('cardBackPinyin');
        const cardCounter = document.getElementById('cardCounter');
        
        const clickHint = document.getElementById('clickHint');
        const quizArea = document.getElementById('quizArea');
        const quizInput = document.getElementById('quizInput');
        const feedbackMessage = document.getElementById('feedbackMessage');
        const scoreDisplay = document.getElementById('scoreDisplay');
        
        const btnStudyMode = document.getElementById('btnStudyMode');
        const btnQuizMode = document.getElementById('btnQuizMode');
        const btnNext = document.getElementById('btnNext');
        const cardContainer = document.getElementById('cardContainer');

        function renderCard() {
            // Reset state
            if(isFlipped) flipCard(false);
            
            // Populate data
            const word = vocab[currentIndex];
            cardFrontText.textContent = word.tk;
            cardBackHanzi.textContent = word.hz;
            cardBackPinyin.textContent = word.py;
            
            // Update UI
            cardCounter.textContent = `Kart: ${currentIndex + 1} / ${vocab.length}`;
            quizInput.value = '';
            feedbackMessage.classList.add('hidden');
            quizAttempted = false;
            
            if (currentMode === 'quiz') {
                quizInput.focus();
                btnNext.innerHTML = 'Bökmek (Skip) <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>';
            } else {
                btnNext.innerHTML = 'Indiki <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>';
            }
        }

        function flipCard(forceState = null) {
            if (forceState !== null) {
                isFlipped = forceState;
            } else {
                isFlipped = !isFlipped;
            }
            
            if (isFlipped) {
                cardInner.classList.add('rotate-y-180');
            } else {
                cardInner.classList.remove('rotate-y-180');
            }
        }

        function handleCardClick() {
            // Only allow clicking to flip in study mode, or if answer was attempted in quiz mode
            if (currentMode === 'study' || (currentMode === 'quiz' && quizAttempted)) {
                flipCard();
            }
        }

        function nextCard() {
            currentIndex++;
            if (currentIndex >= vocab.length) {
                currentIndex = 0; // Loop back to start
            }
            renderCard();
        }

        function prevCard() {
            currentIndex--;
            if (currentIndex < 0) {
                currentIndex = vocab.length - 1; // Loop to end
            }
            renderCard();
        }

        function shuffleCards() {
            // Fisher-Yates Shuffle
            for (let i = vocab.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [vocab[i], vocab[j]] = [vocab[j], vocab[i]];
            }
            currentIndex = 0;
            renderCard();
        }

        function checkAnswer() {
            if(quizAttempted) return; // Prevent multiple checks on same card
            
            const answer = quizInput.value.trim();
            const correctHanzi = vocab[currentIndex].hz;
            
            quizAttempted = true;
            feedbackMessage.classList.remove('hidden');
            
            if (answer === correctHanzi) {
                // Correct
                feedbackMessage.textContent = 'Dogry! (Правильно!)';
                feedbackMessage.className = 'mt-4 text-xl font-bold w-full text-center p-3 rounded-xl shadow-sm bg-green-100 text-green-700 border-2 border-green-300';
                quizScore++;
                scoreDisplay.textContent = `Dogry: ${quizScore}`;
            } else {
                // Incorrect
                feedbackMessage.textContent = `Ýalňyş. Dogry jogap: ${correctHanzi} (${vocab[currentIndex].py})`;
                feedbackMessage.className = 'mt-4 text-lg font-bold w-full text-center p-3 rounded-xl shadow-sm bg-red-100 text-red-700 border-2 border-red-300';
            }
            
            // Show the back of the card
            flipCard(true);
            btnNext.innerHTML = 'Indiki <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>';
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                if(quizAttempted) {
                   nextCard(); 
                } else {
                   checkAnswer();
                }
            }
        }

        function setMode(mode) {
            currentMode = mode;
            if (mode === 'study') {
                btnStudyMode.classList.replace('bg-blue-500', 'bg-blue-800');
                btnQuizMode.classList.replace('bg-blue-800', 'bg-blue-500');
                
                quizArea.classList.add('hidden');
                clickHint.classList.remove('hidden');
                scoreDisplay.classList.add('hidden');
                cardContainer.classList.add('cursor-pointer');
            } else {
                btnQuizMode.classList.replace('bg-blue-500', 'bg-blue-800');
                btnStudyMode.classList.replace('bg-blue-800', 'bg-blue-500');
                
                quizArea.classList.remove('hidden');
                quizArea.classList.add('flex');
                clickHint.classList.add('hidden');
                scoreDisplay.classList.remove('hidden');
                cardContainer.classList.remove('cursor-pointer');
                
                quizScore = 0;
                scoreDisplay.textContent = `Dogry: ${quizScore}`;
            }
            // Reset to beginning of current deck state when switching modes
            renderCard();
        }

        // Initialize App
        window.onload = () => {
            renderCard();
        };
    </script>
</body>
</html>
