<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zehinli.org | Игры и Логические Тренажеры</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root[data-theme="dark"] {
            --bg-primary: #0b0c0e;
            --bg-secondary: #121418;
            --bg-header: #16181d;
            --bg-card: #181a20;
            --bg-elevated: #22252e;
            --border-color: #262932;
            --text-primary: #f0f3f8;
            --text-secondary: #949ba6;
        }

        :root[data-theme="light"] {
            --bg-primary: #f8fafc;
            --bg-secondary: #f1f5f9;
            --bg-header: #ffffff;
            --bg-card: #ffffff;
            --bg-elevated: #f1f5f9;
            --border-color: #e2e8f0;
            --text-primary: #0f172a;
            --text-secondary: #475569;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .portal-header { background-color: var(--bg-header); border-bottom: 1px solid var(--border-color); }
        .portal-card { background-color: var(--bg-card); border: 1px solid var(--border-color); }
        .filter-btn.active { background-color: #9333ea; color: #ffffff; border-color: #9333ea; }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-16">

    <!-- ШАПКА СТРАНИЦЫ ИГР -->
    <header class="portal-header h-16 sticky top-0 z-40 px-4 lg:px-8 flex items-center justify-between">
        <div class="flex items-center gap-4">
            <a href="./index.html" class="text-xs sm:text-sm font-semibold hover:text-purple-500 flex items-center gap-2 transition">
                <i class="fa-solid fa-arrow-left"></i>
                <span>На главную Zehinli.org</span>
            </a>
            <div class="h-5 w-[1px] bg-[var(--border-color)]"></div>
            <span class="text-sm font-bold flex items-center gap-2">
                <i class="fa-solid fa-gamepad text-purple-500"></i>
                <span>Games Hub • Легкие веб-игры</span>
            </span>
        </div>

        <div class="flex items-center gap-2">
            <a href="./desmos.html" class="px-3 py-1.5 rounded-lg bg-indigo-600/15 text-indigo-400 border border-indigo-500/30 text-xs font-medium hover:bg-indigo-600 hover:text-white transition">
                📈 Графики Desmos
            </a>
            <button onclick="toggleTheme()" class="px-3 py-1.5 rounded-lg border border-[var(--border-color)] bg-[var(--bg-elevated)] text-xs font-medium flex items-center gap-2">
                <i class="fa-solid fa-circle-half-stroke text-amber-500"></i>
                <span>Тема</span>
            </button>
        </div>
    </header>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <main class="max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 mt-8">
        
        <!-- Верхний баннер -->
        <div class="portal-card rounded-2xl p-6 sm:p-8 mb-8 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
            <div>
                <span class="text-[11px] font-mono uppercase tracking-widest px-2.5 py-1 rounded bg-purple-500/15 text-purple-400 font-semibold">
                    ZERO-LAG WEB ARCADE
                </span>
                <h1 class="text-2xl sm:text-3xl font-bold mt-2">Каталог легких логических и математических игр</h1>
                <p class="text-xs sm:text-sm text-[var(--text-secondary)] mt-1">
                    Все игры работают в браузере без тяжелых библиотек. Выбери карточку, чтобы запустить или подключить модуль игры.
                </p>
            </div>

            <!-- Фильтры по жанрам -->
            <div class="flex flex-wrap gap-2">
                <button onclick="filterGames('all')" id="filter-all" class="filter-btn active px-3.5 py-1.5 rounded-lg text-xs font-semibold border border-[var(--border-color)] transition">Все (12)</button>
                <button onclick="filterGames('logic')" id="filter-logic" class="filter-btn px-3.5 py-1.5 rounded-lg text-xs font-semibold border border-[var(--border-color)] bg-[var(--bg-elevated)] transition">Логика и Числа</button>
                <button onclick="filterGames('memory')" id="filter-memory" class="filter-btn px-3.5 py-1.5 rounded-lg text-xs font-semibold border border-[var(--border-color)] bg-[var(--bg-elevated)] transition">Память и Счёт</button>
                <button onclick="filterGames('classic')" id="filter-classic" class="filter-btn px-3.5 py-1.5 rounded-lg text-xs font-semibold border border-[var(--border-color)] bg-[var(--bg-elevated)] transition">Классика</button>
            </div>
        </div>

        <!-- Сетка карточек игр -->
        <div id="gamesGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
            <!-- Генерируется скриптом ниже -->
        </div>

    </main>

    <!-- Всплывающее уведомление -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 opacity-0 pointer-events-none transition-all duration-300">
        <div class="portal-card px-5 py-2.5 rounded-full shadow-xl border border-purple-500/40 text-xs font-medium flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-purple-500"></span>
            <span id="toastText">Модуль игры</span>
        </div>
    </div>

    <script>
        // Синхронизация темы
        const htmlEl = document.documentElement;
        function applyTheme(t) {
            htmlEl.setAttribute('data-theme', t);
            localStorage.setItem('zehinli_theme', t);
        }
        function toggleTheme() {
            applyTheme((htmlEl.getAttribute('data-theme') || 'dark') === 'dark' ? 'light' : 'dark');
        }
        applyTheme(localStorage.getItem('zehinli_theme') || 'dark');

        // Список из 12 легких игр для веба (названия + иконки + описания)
        const gamesList = [
            {
                id: 'sudoku',
                title: 'Sudoku (Судоку)',
                cat: 'logic',
                tag: 'Логика • 9×9',
                icon: 'fa-solid fa-table-cells',
                color: 'text-blue-500 bg-blue-500/15 border-blue-500/30',
                desc: 'Классическая числовая головоломка 9×9 с заметками карандашом и 3 уровнями сложности.'
            },
            {
                id: '2048',
                title: '2048 (Степени двойки)',
                cat: 'logic',
                tag: 'Математика • Плитки',
                icon: 'fa-solid fa-cubes-stacked',
                color: 'text-amber-500 bg-amber-500/15 border-amber-500/30',
                desc: 'Двигай плитки со степенями числа 2, чтобы собрать блок 2048 за минимальное число ходов.'
            },
            {
                id: 'minesweeper',
                title: 'Minesweeper (Сапёр)',
                cat: 'logic',
                tag: 'Сапёр • Дедукция',
                icon: 'fa-solid fa-bomb',
                color: 'text-rose-500 bg-rose-500/15 border-rose-500/30',
                desc: 'Разминируй поле по числовым подсказкам соседних клеток и ставь флажки.'
            },
            {
                id: 'nonogram',
                title: 'Nonogram (Нонограммы)',
                cat: 'logic',
                tag: 'Кроссворд • Сетка',
                icon: 'fa-solid fa-border-all',
                color: 'text-emerald-500 bg-emerald-500/15 border-emerald-500/30',
                desc: 'Японские графические кроссворды: закрашивай ячейки по числам строк и столбцов.'
            },
            {
                id: 'mental-math',
                title: 'Mental Math (Устный счёт)',
                cat: 'memory',
                tag: 'Скорость • Счёт',
                icon: 'fa-solid fa-bolt',
                color: 'text-yellow-500 bg-yellow-500/15 border-yellow-500/30',
                desc: 'Скоростной тренажер арифметики, степеней и корней на таймер 60 секунд.'
            },
            {
                id: 'chess-puzzles',
                title: 'Chess Tactics (Шахматы)',
                cat: 'logic',
                tag: 'Тактика • Этюды',
                icon: 'fa-solid fa-chess-knight',
                color: 'text-indigo-500 bg-indigo-500/15 border-indigo-500/30',
                desc: 'Короткие шахматные задачи: найди мат в 1, 2 или 3 хода либо выигрыш фигуры.'
            },
            {
                id: 'lights-out',
                title: 'Lights Out (Матрица света)',
                cat: 'logic',
                tag: 'Линейная алгебра',
                icon: 'fa-regular fa-lightbulb',
                color: 'text-cyan-500 bg-cyan-500/15 border-cyan-500/30',
                desc: 'Клик по ячейке переключает её и соседей. Погаси все огни на поле 5×5.'
            },
            {
                id: 'memory-grid',
                title: 'Memory Matrix (Память)',
                cat: 'memory',
                tag: 'Пространственная память',
                icon: 'fa-solid fa-brain',
                color: 'text-pink-500 bg-pink-500/15 border-pink-500/30',
                desc: 'Запомни расположение подсвеченных плиток за 2 секунды и повтори паттерн.'
            },
            {
                id: 'hanoi',
                title: 'Tower of Hanoi (Башня)',
                cat: 'logic',
                tag: 'Алгоритмы • Рекурсия',
                icon: 'fa-solid fa-layer-group',
                color: 'text-orange-500 bg-orange-500/15 border-orange-500/30',
                desc: 'Перемести пирамиду из дисков на другой стержень за $2^n - 1$ ходов.'
            },
            {
                id: 'tetris',
                title: 'Tetris Block (Тетрис)',
                cat: 'classic',
                tag: 'Аркада • 2D Canvas',
                icon: 'fa-solid fa-shapes',
                color: 'text-purple-500 bg-purple-500/15 border-purple-500/30',
                desc: 'Классический стакан с падающими тетрамино, ускорением и подсчетом линий.'
            },
            {
                id: 'wordle',
                title: 'Wordle / Tech Terms',
                cat: 'memory',
                tag: 'Слова • 5 букв',
                icon: 'fa-solid fa-spell-check',
                color: 'text-teal-500 bg-teal-500/15 border-teal-500/30',
                desc: 'Угадай загаданный термин из 5 букв за 6 попыток по цветовым подсказкам.'
            },
            {
                id: 'snake',
                title: 'Cyber Snake (Змейка)',
                cat: 'classic',
                tag: 'Ретро • Сетка',
                icon: 'fa-solid fa-staff-snake',
                color: 'text-lime-500 bg-lime-500/15 border-lime-500/30',
                desc: 'Легкая векторная змейка на чистом Canvas с управлением стрелками или WASD.'
            }
        ];

        function renderGames(filter = 'all') {
            const grid = document.getElementById('gamesGrid');
            const filtered = filter === 'all' ? gamesList : gamesList.filter(g => g.cat === filter);

            grid.innerHTML = filtered.map(g => `
                <div onclick="showGameNotice('${g.title}')" class="portal-card rounded-2xl p-5 flex flex-col justify-between hover:border-purple-500 transition cursor-pointer group">
                    <div>
                        <div class="flex items-center justify-between mb-4">
                            <div class="w-12 h-12 rounded-xl border ${g.color} flex items-center justify-center text-xl group-hover:scale-110 transition">
                                <i class="${g.icon}"></i>
                            </div>
                            <span class="text-[11px] font-mono px-2.5 py-1 rounded-full bg-[var(--bg-elevated)] text-[var(--text-secondary)]">
                                ${g.tag}
                            </span>
                        </div>
                        <h3 class="text-base font-bold group-hover:text-purple-400 transition">${g.title}</h3>
                        <p class="text-xs text-[var(--text-secondary)] mt-1.5 leading-relaxed">${g.desc}</p>
                    </div>

                    <div class="mt-5 pt-3 border-t border-[var(--border-color)] flex items-center justify-between text-xs">
                        <span class="text-[var(--text-secondary)] font-mono">Light JS</span>
                        <span class="font-semibold text-purple-500 group-hover:translate-x-1 transition">
                            Скоро / Запустить →
                        </span>
                    </div>
                </div>
            `).join('');
        }

        function filterGames(cat) {
            ['all', 'logic', 'memory', 'classic'].forEach(c => {
                document.getElementById('filter-' + c).classList.toggle('active', c === cat);
            });
            renderGames(cat);
        }

        let timer = null;
        function showGameNotice(name) {
            const toast = document.getElementById('toast');
            document.getElementById('toastText').textContent = `Карточка «${name}» готова. Скажи, какую игру напишем первой!`;
            toast.classList.remove('opacity-0');
            clearTimeout(timer);
            timer = setTimeout(() => toast.classList.add('opacity-0'), 2800);
        }

        renderGames('all');
    </script>
</body>
</html>
